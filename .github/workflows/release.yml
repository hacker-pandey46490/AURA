name: Signed release APK (optional)

# Requires repository secrets:
#   AURA_KEYSTORE_BASE64, AURA_KEYSTORE_PASSWORD, AURA_KEY_ALIAS, AURA_KEY_PASSWORD
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1); yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.AURA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aura.jks"

      - name: Build signed release
        env:
          AURA_KEYSTORE_PATH: ${{ runner.temp }}/aura.jks
          AURA_KEYSTORE_PASSWORD: ${{ secrets.AURA_KEYSTORE_PASSWORD }}
          AURA_KEY_ALIAS: ${{ secrets.AURA_KEY_ALIAS }}
          AURA_KEY_PASSWORD: ${{ secrets.AURA_KEY_PASSWORD }}
        run: gradle :core:test assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aura-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
